<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Nim tournament</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geomini:wght@200..800&display=swap">
  <link rel="stylesheet" href="/table.css">
  <link rel="stylesheet" href="/lobby.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-spade" viewBox="0 0 256 256" fill="currentColor"><path d="M232,136a56,56,0,0,1-83.4,48.82l11.06,36.88A8,8,0,0,1,152,232H104a8,8,0,0,1-7.66-10.3l11.06-36.88A56,56,0,0,1,24,136c0-32,17.65-62.84,51-89.27a234.14,234.14,0,0,1,49.89-30.11,7.93,7.93,0,0,1,6.16,0A234.14,234.14,0,0,1,181,46.73C214.35,73.16,232,104,232,136Z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-stones" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="18.1" rx="9.3" ry="3.8"/><ellipse cx="12.8" cy="11.7" rx="7.4" ry="3.2"/><ellipse cx="10.8" cy="5.5" rx="5.6" ry="2.7"/><path d="M4.5 18.7Q5.1 15.9 8.6 14.8"/><path d="M6.3 6.1Q6.7 4.2 9.0 3.6"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.6 5.6 3.8 7.3a1.5 1.5 0 0 0-.9 1.9l3.6 10.4a1.5 1.5 0 0 0 1.9.9l6.1-2.1"/><rect x="8.6" y="2.4" width="9.6" height="15.2" rx="1.7"/><g fill="currentColor" stroke="none"><circle cx="13.4" cy="8.5" r="1.9"/><circle cx="11.9" cy="11.1" r="1.9"/><circle cx="14.9" cy="11.1" r="1.9"/><path d="M12.45 15.3c.6-1.15.9-2.3.95-3.45h0c.05 1.15.35 2.3.95 3.45z"/></g></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4M8 4h8M9 13h.01M15 13h.01M9 16h6"/></symbol>
  </svg>

  <div class="window three">
    <!-- left: you, the entrants, the entry form -->
    <section class="pane pane-list" aria-label="Entrants">
      <div class="toolbar">
        <div class="title"><svg class="icon"><use href="#i-spade"/></svg><a href="/">Card Nim</a></div>
        <span class="spacer"></span>
        <a class="iconbtn" href="/" title="Back to the lobby" aria-label="Back to the lobby"><svg class="icon"><use href="#i-home"/></svg></a>
      </div>
      <div class="scroll">
        <div class="join-card" id="series" hidden>
          <div class="group-title">Series <span class="secondary" id="series-count"></span></div>
          <div class="list" id="series-board" style="max-height:none;min-height:0"></div>
          <button class="btn full" type="button" id="restart-btn" hidden><svg class="icon"><use href="#i-trophy"/></svg>Restart tournament</button>
          <p class="hint" id="restart-hint" style="margin:0;font-size:12px;color:var(--secondary)" hidden></p>
          <span class="error" id="restart-error" role="alert"></span>
        </div>
        <div class="you-card" id="you" hidden></div>
        <div class="group-title">Entrants <span class="secondary" id="entrants-count"></span></div>
        <div class="list" id="entrants" style="max-height:none;min-height:0"><div class="list-empty">Loading…</div></div>
        <form class="join-card" id="join-form" autocomplete="off" hidden>
          <div class="group-title">Enter the tournament</div>
          <label class="field"><span class="k">Name</span><input name="name" type="text" maxlength="36" placeholder="Your name or team" autocomplete="off"></label>
          <div class="field">
            <span class="k">Strategy</span>
            <div class="pick-row">
              <button class="btn small" type="button" id="join-file-btn">Choose files…</button>
              <button class="btn small" type="button" id="join-folder-btn">Choose a folder…</button>
            </div>
            <input type="file" id="join-file" name="file" multiple hidden>
            <input type="file" id="join-folder" webkitdirectory directory multiple hidden>
            <span class="picked" id="join-picked"></span>
          </div>
          <div class="field"><span class="k">Face</span><div class="faces" id="faces"></div></div>
          <ol class="steps" id="upload-steps" hidden aria-live="polite"></ol>
          <p class="hint" id="join-hint" style="margin:0;font-size:12px;color:var(--secondary)"></p>
          <button class="btn blue full" type="submit"><svg class="icon"><use href="#i-person"/></svg>Join</button>
          <span class="error" id="join-error" role="alert"></span>
        </form>
        <div class="join-card" id="qr-panel" hidden>
          <div class="group-title">Enter from another device</div>
          <div class="qr-card">
            <div class="qr" id="qr" aria-hidden="true"></div>
            <div class="qr-text">
              <div class="qr-url" id="qr-url"></div>
              <div class="secondary">Scan to open this bracket on a phone or another laptop.</div>
            </div>
          </div>
          <div class="secondary" style="font-size:12px" id="qr-cmd-label">Or enter a strategy straight from a terminal:</div>
          <code class="cmd" id="qr-cmd"></code>
        </div>
      </div>
      <div class="footer">
        <div class="item"><svg class="icon"><use href="#i-link"/></svg><span id="server-info"></span></div>
      </div>
    </section>

    <!-- right: the bracket -->
    <section class="pane pane-detail" aria-label="Bracket">
      <div class="toolbar">
        <div class="title" id="title">Tournament</div>
        <div class="head-stats" id="settings"></div>
        <span class="spacer"></span>
        <div class="actions" id="actions"></div>
      </div>
      <div class="detail" id="detail"><div class="detail-empty">Connecting…</div></div>
    </section>

    <!-- right: the match being played, as the real table -->
    <section class="pane pane-table" aria-label="Table">
      <div class="toolbar">
        <div class="title" id="table-title">Table</div>
        <span class="spacer"></span>
        <div class="actions" id="table-actions"></div>
      </div>
      <div class="table-pane" id="livetable"></div>
    </section>
  </div>

  <script src="/qr.js"></script>
  <script src="/fireworks.js"></script>
  <script src="/tournament.js"></script>
</body>
</html>
