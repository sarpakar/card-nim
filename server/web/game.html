<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Nim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geomini:wght@200..800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 256 256"><path d="M232,136a56,56,0,0,1-83.4,48.82l11.06,36.88A8,8,0,0,1,152,232H104a8,8,0,0,1-7.66-10.3l11.06-36.88A56,56,0,0,1,24,136c0-32,17.65-62.84,51-89.27a234.14,234.14,0,0,1,49.89-30.11,7.93,7.93,0,0,1,6.16,0A234.14,234.14,0,0,1,181,46.73C214.35,73.16,232,104,232,136Z"/></svg></span>
      <a href="/">Card Nim</a>
    </div>
    <div class="meta" id="meta">
      <span>Table <strong id="meta-id">…</strong></span>
      <span><strong id="meta-stones">–</strong> stones</span>
      <span>cards 1..<strong id="meta-cards">–</strong></span>
      <span><strong id="meta-clock">–</strong> / player</span>
      <span id="meta-label"></span>
    </div>
    <nav class="nav" aria-label="Main">
      <a class="nav-item" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>
        Lobby
      </a>
      <span class="nav-item active" aria-current="page">
        <svg viewBox="0 0 64 40" aria-hidden="true" class="table-icon"><path d="M20 3H44A17 17 0 0 1 44 37H20A17 17 0 0 1 20 3Z" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="13 4"/><path fill="currentColor" fill-rule="evenodd" d="M19 8H45A12 12 0 0 1 45 32H19A12 12 0 0 1 19 8Z M16 16L25 12V29L19 31Z M18 17L23.5 14.5V27.5L20 28.8Z M48 16L39 12V29L45 31Z M46 17L40.5 14.5V27.5L44 28.8Z M26 10H38V30H26Z M28 12H36V28H28Z M32 15.5L34.6 20L32 24.5L29.4 20Z"/></svg>
        Table
      </span>
    </nav>
  </header>

  <main class="board">
    <section>
      <div class="table">
        <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>
        <div class="winner-card" id="winner" role="dialog" aria-label="Result" hidden>
          <div class="big-avatar" id="winner-avatar"></div>
          <div class="label" id="winner-label">Winner</div>
          <h2 id="winner-name">…</h2>
          <div class="why" id="winner-why"></div>
          <div class="actions" id="winner-actions"></div>
        </div>
        <div class="player s1" id="player-1">
          <div class="player-head">
            <div class="pod">
              <div class="avatar" aria-hidden="true">1</div>
              <div class="pod-text">
                <div class="player-name"><span class="seat-tag s1">1</span> <span class="name">…</span></div>
                <div class="clock-wrap">
                  <div class="bar" aria-hidden="true"><div class="bar-fill clock-fill"></div></div>
                  <div class="clock">–</div>
                </div>
                <div class="cards-left"></div>
              </div>
            </div>
          </div>
          <div class="hand"></div>
          <div class="hand-note"></div>
          <div class="seat-join" hidden></div>
        </div>

        <div class="pile" id="pile">
          <div class="count-label" id="count-label">stones on the table</div>
          <div class="count" id="count">–</div>
          <div class="bar gold" role="progressbar" aria-label="stones remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="stones-bar">
            <div class="bar-fill" id="stones-fill"></div>
            <span class="bar-label" id="stones-bar-label"></span>
          </div>
          <div class="pebbles" id="pebbles"></div>
        </div>

        <div class="player s2" id="player-2">
          <div class="player-head">
            <div class="pod">
              <div class="avatar" aria-hidden="true">2</div>
              <div class="pod-text">
                <div class="player-name"><span class="seat-tag s2">2</span> <span class="name">…</span></div>
                <div class="clock-wrap">
                  <div class="bar" aria-hidden="true"><div class="bar-fill clock-fill"></div></div>
                  <div class="clock">–</div>
                </div>
                <div class="cards-left"></div>
              </div>
            </div>
          </div>
          <div class="hand"></div>
          <div class="hand-note"></div>
          <div class="seat-join" hidden></div>
        </div>
      </div>
    </section>

    <aside>
      <div class="panel log">
        <h2 class="panel-title"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#6e6e73" stroke-width="2.2" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg></span>Moves</h2>
        <div class="log-scroll">
          <table>
            <thead>
              <tr><th class="num">#</th><th>Player</th><th class="num">Card</th><th class="num">Left</th><th class="num">Time</th></tr>
            </thead>
            <tbody id="log-body"><tr><td class="empty" colspan="5">No moves yet.</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="panel side-info" id="side-info"></div>
      <div class="panel banner" id="banner" role="status">
        <div id="banner-text">Connecting…</div>
        <div class="actions" id="banner-actions"></div>
      </div>
    </aside>
  </main>

  <script src="/game.js"></script>
</body>
</html>
